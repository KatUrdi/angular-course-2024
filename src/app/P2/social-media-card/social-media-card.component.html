<div class="p-3 border-black outline-2 rounded-xl" [ngStyle]="{ 'background-color': getPlatformColor(name) }">
    <button (click)="sendCodeToParent(added ? 0 : 1)">
        {{ added ? 'x' : '+' }}
    </button>
    <div class="flex flex-row items-center justify-center w-full">
        {{ name }}
    </div>
</div>
